<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Raspberry Pi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {}
    }
  }
</script>
<style>
  .sortable-ghost {
    opacity: 0.4;
  }
  .sortable-drag {
    transform: rotate(2deg) scale(1.05);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800">

<div class="min-h-screen p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800 dark:text-gray-100">Mes Raspberry Pi</h1>
      <div class="flex gap-2 items-center">
        <button onclick="openModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Ajouter
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
          <svg id="sun-icon" class="hidden w-5 h-5 text-gray-800 dark:text-gray-200" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg id="moon-icon" class="w-5 h-5 text-gray-800 dark:text-gray-200" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden">
      <div class="bg-white dark:bg-gray-800 rounded-xl p-16 text-center border-2 border-dashed border-gray-300 dark:border-gray-600">
        <p class="text-gray-600 dark:text-gray-400 mb-4">Aucun Raspberry Pi configuré</p>
        <button onclick="openModal()" class="inline-flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors text-gray-700 dark:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Ajouter un RPI
        </button>
      </div>
    </div>

    <!-- Device Grid -->
    <div id="deviceGrid" class="flex flex-wrap -m-3"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md p-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Nouveau Raspberry Pi</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nom</label>
        <input id="deviceName" type="text" placeholder="RPI Salon" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-gray-100">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Adresse IP</label>
        <input id="deviceIP" type="text" placeholder="192.168.1.50:65030" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-gray-100">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="addDevice()" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
          Ajouter
        </button>
        <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors text-gray-700 dark:text-gray-300">
          Annuler
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// State
let devices = [];
let order = [];
let mounted = false;

// Theme
function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'light';
  if (savedTheme === 'dark') {
    document.documentElement.classList.add('dark');
  }
  updateThemeIcons();
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeIcons();
}

function updateThemeIcons() {
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('sun-icon').classList.toggle('hidden', !isDark);
  document.getElementById('moon-icon').classList.toggle('hidden', isDark);
}

// Storage
function loadDevices() {
  const savedDevices = localStorage.getItem('devices');
  const savedOrder = localStorage.getItem('devices_order');
  
  if (savedDevices) devices = JSON.parse(savedDevices);
  if (savedOrder) order = JSON.parse(savedOrder);
  
  mounted = true;
  render();
}

function saveDevices() {
  if (!mounted) return;
  localStorage.setItem('devices', JSON.stringify(devices));
  
  const deviceIds = devices.map(d => d.id);
  const validOrder = order.filter(id => deviceIds.includes(id));
  const newIds = deviceIds.filter(id => !validOrder.includes(id));
  const finalOrder = [...validOrder, ...newIds];
  
  order = finalOrder;
  localStorage.setItem('devices_order', JSON.stringify(finalOrder));
}

// Modal
function openModal() {
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('deviceName').value = '';
  document.getElementById('deviceIP').value = '';
}

// Device Management
function addDevice() {
  const name = document.getElementById('deviceName').value.trim();
  const ip = document.getElementById('deviceIP').value.trim();
  
  if (!name || !ip) {
    alert('Nom et IP requis');
    return;
  }
  
  const newDevice = {
    id: Date.now(),
    name,
    ip,
    temperature: null,
    humidity: null,
    lampStatus: 'off',
    lastUpdate: Date.now(),
    isOffline: false
  };
  
  devices.push(newDevice);
  order.push(newDevice.id);
  saveDevices();
  render();
  closeModal();
  fetchDeviceData(newDevice.ip);
}

function deleteDevice(id) {
  if (!confirm('Supprimer ce Raspberry Pi ?')) return;
  
  devices = devices.filter(d => d.id !== id);
  order = order.filter(o => o !== id);
  saveDevices();
  render();
}

async function toggleLamp(ip, currentStatus) {
  const action = currentStatus === 'on' ? 'off' : 'on';
  
  // Optimistic update
  const device = devices.find(d => d.ip === ip);
  if (device) {
    device.lampStatus = action;
    render();
  }
  
  try {
    const res = await fetch(`http://${ip}/led/${action}`, {
      method: 'POST',
    });
    
    if (!res.ok) throw new Error('Network error');
    
    const data = await res.json();
    const dev = devices.find(d => d.ip === ip);
    if (dev) {
      dev.lampStatus = data.led || action;
      dev.isOffline = false;
      saveDevices();
      render();
    }
  } catch (error) {
    console.error('Toggle lamp error:', error);
    // Revert on error
    if (device) {
      device.lampStatus = currentStatus;
      device.isOffline = true;
      render();
    }
  }
}

// Fetch Data
async function fetchDeviceData(ip) {
  const device = devices.find(d => d.ip === ip);
  if (!device) return;
  
  try {
    const res = await fetch(`http://${ip}/status`, {
      method: 'GET',
    });
    
    if (!res.ok) throw new Error('Network error');
    
    const data = await res.json();
    device.temperature = data.temperature ?? null;
    device.humidity = data.humidity ?? null;
    device.lampStatus = data.lampStatus ?? 'off';
    device.isOffline = false;
    device.lastUpdate = Date.now();
    saveDevices();
    render();
  } catch (error) {
    console.error(`Fetch error for ${ip}:`, error);
    device.isOffline = true;
    saveDevices();
    render();
  }
}

function updateAllDevices() {
  devices.forEach(d => fetchDeviceData(d.ip));
}

// Render
function render() {
  const grid = document.getElementById('deviceGrid');
  const emptyState = document.getElementById('emptyState');
  
  if (devices.length === 0) {
    emptyState.classList.remove('hidden');
    grid.innerHTML = '';
    return;
  }
  
  emptyState.classList.add('hidden');
  
  const orderedDevices = order
    .map(id => devices.find(d => d.id === id))
    .filter(d => d)
    .concat(devices.filter(d => !order.includes(d.id)));
  
  grid.innerHTML = orderedDevices.map(device => `
    <div class="w-full md:w-1/2 lg:w-1/3 p-3" data-id="${device.id}">
      <div class="h-full relative bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-200 dark:border-gray-700">
        ${device.isOffline ? `
          <div class="absolute inset-0 top-[60px] bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm rounded-b-xl flex flex-col items-center justify-center z-10 text-gray-500 dark:text-gray-400">
            <span class="font-bold text-lg">HORS LIGNE</span>
            <span class="text-xs">Vérifiez la connexion</span>
          </div>
        ` : ''}
        
        <div class="p-4 pb-2 border-b border-gray-100 dark:border-gray-700">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3 flex-1">
              <div class="cursor-grab active:cursor-grabbing p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 truncate">${device.name}</h3>
                <p class="text-xs text-gray-400 dark:text-gray-500 font-mono mt-0.5">${device.ip}</p>
              </div>
            </div>
            <button onclick="deleteDevice(${device.id})" class="p-2 rounded hover:bg-red-50 dark:hover:bg-red-950 text-red-400 hover:text-red-600 dark:text-red-500 dark:hover:text-red-400 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
          </div>
        </div>

        <div class="p-4 space-y-5">
          <div class="bg-gradient-to-br from-orange-50 to-amber-50 dark:from-orange-950 dark:to-amber-950 rounded-xl p-5 text-center border border-orange-100 dark:border-orange-800">
            <div class="flex justify-center mb-2">
              <svg class="h-6 w-6 text-orange-500 dark:text-orange-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
            </div>
            ${device.temperature !== null ? `
              <div class="text-3xl font-bold text-gray-800 dark:text-gray-100">
                ${device.temperature.toFixed(1)}°C
              </div>
              ${device.humidity !== null ? `
                <div class="flex items-center justify-center gap-1.5 mt-2 text-sm text-blue-600 dark:text-blue-400 font-medium">
                  <svg class="h-3 w-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                  ${device.humidity.toFixed(1)}%
                </div>
              ` : ''}
            ` : `
              <div class="text-gray-400 dark:text-gray-500 py-2">--°C</div>
            `}
          </div>

          <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-900 border border-gray-100 dark:border-gray-700 rounded-lg">
            <div class="flex items-center gap-3">
              <div class="p-2 rounded-full ${device.lampStatus === 'on' ? 'bg-yellow-100 text-yellow-600 dark:bg-yellow-900 dark:text-yellow-400' : 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400'}">
                ${device.lampStatus === 'on' ? `
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                ` : `
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8 11.2c.8-.9 1.2-2 1.2-3.2a6 6 0 0 0-9.3-5"/><path d="m2 2 20 20"/><path d="M6.3 6.3a4.67 4.67 0 0 0 1.2 5.2c.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                `}
              </div>
              <span class="font-medium text-sm text-gray-700 dark:text-gray-300">Éclairage</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" ${device.lampStatus === 'on' ? 'checked' : ''} ${device.isOffline ? 'disabled' : ''} onchange="toggleLamp('${device.ip}', '${device.lampStatus}')" class="sr-only peer">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed"></div>
            </label>
          </div>
        </div>
      </div>
    </div>
  `).join('');
  
  // Initialize Sortable
  initSortable();
}

// Drag & Drop with Sortable.js
function initSortable() {
  const grid = document.getElementById('deviceGrid');
  new Sortable(grid, {
    animation: 150,
    handle: '.cursor-grab',
    ghostClass: 'sortable-ghost',
    dragClass: 'sortable-drag',
    onEnd: function(evt) {
      const oldIndex = evt.oldIndex;
      const newIndex = evt.newIndex;
      
      if (oldIndex === newIndex) return;
      
      const [removed] = order.splice(oldIndex, 1);
      order.splice(newIndex, 0, removed);
      
      saveDevices();
      render();
    }
  });
}

// Initialize
initTheme();
loadDevices();
setInterval(updateAllDevices, 5000);
console.log('Dashboard Raspberry Pi chargé');
</script>

</body>
</html>
